name: Build Gauguin KernelSU Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU 变种版本'
        required: true
        default: 'ksu_next'
        type: choice
        options:
          - 'ksu_next'
          - 'official'
      ksu_version:
        description: 'KernelSU 分支或 Tag (如 main, v0.9.5)'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    name: Compile Gauguin Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装 Linux 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 libncurses-dev zip curl git ccache libxml2-utils \
            device-tree-compiler binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: 拉取 Proton-Clang 交叉编译工具链
        run: |
          echo ">> 正在下载 Proton-Clang 工具链..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

      - name: 拉取小米 Gauguin 内核源码 (main 干净分支)
        run: |
          echo ">> 正在拉取 Gauguin (骁龙750G) 官方维护的干净主分支源码..."
          git clone --depth=1 https://github.com/Molyuu/neko_kernel_xiaomi_gauguin.git -b main $GITHUB_WORKSPACE/kernel

      - name: 集成 KernelSU 驱动与内核配置
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # 清理旧有的残留链接或子模块目录
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          
          KSU_TYPE="${{ github.event.inputs.ksu_type || 'ksu_next' }}"
          KSU_VER="${{ github.event.inputs.ksu_version || 'main' }}"
          echo ">> 当前构建参数: KSU_TYPE=$KSU_TYPE, KSU_VER=$KSU_VER"

          if [ "$KSU_TYPE" = "ksu_next" ]; then
            echo ">> 正在安装 KernelSU-Next (具有更好的 4.19 Non-GKI 支持与 SUSFS 兼容)..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          else
            echo ">> 正在安装官方 KernelSU ($KSU_VER)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_VER"
          fi

          DEFCONFIG="arch/arm64/configs/vendor/gauguin_user_defconfig"
          echo ">> 开启 KPROBES、OVERLAY_FS 及 KSU 支持..."
          scripts/config --file $DEFCONFIG -e KPROBES
          scripts/config --file $DEFCONFIG -e HAVE_KPROBES
          scripts/config --file $DEFCONFIG -e KPROBE_EVENTS
          scripts/config --file $DEFCONFIG -e OVERLAY_FS
          scripts/config --file $DEFCONFIG -e KSU

      - name: 修复旧内核兼容 (MODULE_IMPORT_NS 等宏兼容)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          echo ">> 向 include/linux/module.h 注入 MODULE_IMPORT_NS 回退宏..."
          grep -q "MODULE_IMPORT_NS" include/linux/module.h || printf "\n#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n" >> include/linux/module.h

          echo ">> 递归扫描并修补 KernelSU 源码中所有 MODULE_IMPORT_NS 引用..."
          python3 - <<'PY'
          import glob, os

          patterns = [
              "drivers/kernelsu/**/*.c",
              "drivers/kernelsu/**/*.h",
              "KernelSU*/**/*.c",
              "KernelSU*/**/*.h"
          ]
          
          files = set()
          for pat in patterns:
              files.update(glob.glob(pat, recursive=True))

          for filepath in files:
              if not os.path.isfile(filepath):
                  continue
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
              except Exception:
                  continue
              
              if "MODULE_IMPORT_NS" in content:
                  if "#ifndef MODULE_IMPORT_NS" not in content:
                      content = "#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n" + content
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f">> 成功为源码注入兼容宏: {filepath}")
          print(">> 兼容性扫描与修补完成！")
          PY

      - name: 编译内核与设备树
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          echo ">> 生成内核 .config..."
          make O=out CC=clang ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            OBJDUMP=llvm-objdump \
            vendor/gauguin_user_defconfig

          echo ">> 开始并行编译内核及 DTB..."
          make O=out CC=clang ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            OBJDUMP=llvm-objdump \
            -j$(nproc) Image dtbs 2>&1 | tee $GITHUB_WORKSPACE/build.log || (echo "=== 编译失败，输出最后 100 行关键日志 ===" && tail -n 100 $GITHUB_WORKSPACE/build.log && exit 1)

      - name: 提取产物并合成最终刷机文件
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out_artifacts
          cp kernel/out/arch/arm64/boot/Image out_artifacts/Image
          
          # 合并所有生成的 dtb 文件（容错处理）
          find kernel/out -name "*.dtb" | xargs -r cat > out_artifacts/dtb || true
          
          # 拉取 AnyKernel3 模版
          git clone --depth=1 https://github.com/Molyuu/AnyKernel3.git -b main AnyKernel3
          
          # 解包原厂 pure_stock_boot.img 并合成 boot-kernelsu.img
          if [ -f "pure_stock_boot.img.gz" ]; then
            echo ">> 正在从原机纯净底包合成 boot-kernelsu.img..."
            gzip -dc pure_stock_boot.img.gz > pure_stock_boot.img
            
            cp AnyKernel3/tools/magiskboot .
            chmod +x magiskboot
            
            mkdir boot_unpack && cd boot_unpack
            ../magiskboot unpack ../pure_stock_boot.img
            
            # 替换内核为刚刚编译出的 KernelSU 内核
            cp ../out_artifacts/Image kernel
            if [ -s ../out_artifacts/dtb ]; then
              cp ../out_artifacts/dtb dtb
            fi
            
            ../magiskboot repack ../pure_stock_boot.img ../out_artifacts/boot-kernelsu.img
            cd ..
            echo ">> boot-kernelsu.img 合成成功！"
          fi

          # 打包 AnyKernel3 卡刷包
          cp out_artifacts/Image AnyKernel3/Image
          if [ -s out_artifacts/dtb ]; then
            cp out_artifacts/dtb AnyKernel3/dtb
          fi
          cd AnyKernel3
          ZIP_NAME="AnyKernel3-Gauguin-KernelSU-$(date +'%Y%m%d%H%M').zip"
          zip -r9 ../out_artifacts/$ZIP_NAME * -x .git README.md
          echo ">> AnyKernel3 打包成功: $ZIP_NAME"

      - name: 上传编译产物 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gauguin-KernelSU-Output
          path: |
            out_artifacts/*
