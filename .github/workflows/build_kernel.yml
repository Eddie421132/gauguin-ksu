name: Build Gauguin KernelSU Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU Version'
        required: true
        default: 'v0.9.5'
        type: string

jobs:
  build:
    name: Compile Gauguin Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装 Linux 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 libncurses-dev zip curl git ccache libxml2-utils \
            device-tree-compiler binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: 拉取 Proton-Clang 交叉编译工具链
        run: |
          echo ">> 正在下载 Proton-Clang 工具链..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

      - name: 拉取小米官方开源内核 (gauguin-r-oss 原厂 4.19.113)
        run: |
          echo ">> 正在克隆小米官方 gauguin-r-oss (MIUI 14 原生 4.19.113) 源码..."
          git clone --depth=1 --single-branch -b gauguin-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git $GITHUB_WORKSPACE/kernel

      - name: 应用 MIUI 原厂模块兼容补丁与集成 KernelSU
        run: |
          cd $GITHUB_WORKSPACE/kernel

          echo ">> 修复 Ubuntu GCC 10+ 下 dtc-lexer yylloc 重复定义..."
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true


          echo ">> 核心补丁：修改 kernel/module.c，无条件放行 MIUI 原厂 /vendor/lib/modules 硬件驱动..."
          python3 - <<'PY'
          p = "kernel/module.c"
          with open(p, "r", encoding="utf-8", errors="ignore") as f:
              s = f.read()

          t1 = "static int check_version(const struct load_info *info,\n\t\t\t const char *symname,\n\t\t\t struct module *mod,\n\t\t\t const s32 *crc)\n{"
          r1 = t1 + "\n\treturn 1;"
          if t1 in s:
              s = s.replace(t1, r1)
              print("✔ 成功破解 check_version (符号 CRC 校验全面放行)")
          else:
              print("⚠ 未直接匹配到 t1，尝试正则表达式替换...")
              import re
              s, count1 = re.subn(r'(static\s+int\s+check_version\s*\([^\{]+\{)', r'\1\n\treturn 1;', s, count=1)
              print(f"正则替换 check_version 结果: {count1} 处修改")

          t2 = "static int check_modinfo(struct module *mod, struct load_info *info, int flags)\n{"
          r2 = t2 + "\n\treturn 0;"
          if t2 in s:
              s = s.replace(t2, r2)
              print("✔ 成功破解 check_modinfo (Vermagic 版本号校验全面放行)")
          else:
              print("⚠ 未直接匹配到 t2，尝试正则表达式替换...")
              import re
              s, count2 = re.subn(r'(static\s+int\s+check_modinfo\s*\([^\{]+\{)', r'\1\n\treturn 0;', s, count=1)
              print(f"正则替换 check_modinfo 结果: {count2} 处修改")

          with open(p, "w", encoding="utf-8") as f:
              f.write(s)

          # 3. 修复 Makefile GCC_TOOLCHAIN_DIR 前缀 (解决 Clang 12+ as: unrecognized option '-EL')
          with open("Makefile", "r", encoding="utf-8", errors="ignore") as f:
              mf = f.read()
          old_prefix = "CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)\n"
          new_prefix = "CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))\n"
          if old_prefix in mf:
              mf = mf.replace(old_prefix, new_prefix)
              print("✔ 成功修复 Makefile Clang cross prefix")
          else:
              import re
              mf, count3 = re.subn(r'(CLANG_FLAGS\s*\+=\s*--prefix=\$\(GCC_TOOLCHAIN_DIR\))', r'\1$(notdir $(CROSS_COMPILE))', mf)
              print(f"正则替换 Clang cross prefix 结果: {count3} 处修改")
          with open("Makefile", "w", encoding="utf-8") as f:
              f.write(mf)

          # 4. 补充 lib/string.c stpcpy 符号 (避免 Clang 12+ libcall 优化导致未定义符号)
          with open("lib/string.c", "r", encoding="utf-8", errors="ignore") as f:
              sc = f.read()
          if "stpcpy" not in sc:
              sc += "\nchar *stpcpy(char *__restrict__ dest, const char *__restrict__ src);\nchar *stpcpy(char *__restrict__ dest, const char *__restrict__ src)\n{\n\twhile ((*dest++ = *src++) != '\\0')\n\t\t/* nothing */;\n\treturn --dest;\n}\nEXPORT_SYMBOL(stpcpy);\n"
              with open("lib/string.c", "w", encoding="utf-8") as f:
                  f.write(sc)
              print("✔ 成功向 lib/string.c 注入 stpcpy 兼容实现")

          # 5. 修复 gsi.c 和 msm_gsi.h 中误用的 union __packed 导致 genksyms 崩溃及 ld 链接失败
          for fpath in ["drivers/platform/msm/gsi/gsi.c", "drivers/platform/msm/gsi/gsi.h", "include/linux/msm_gsi.h"]:
              try:
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      c = f.read()
                  if "union __packed" in c:
                      c = c.replace("union __packed", "union")
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(c)
                      print(f"✔ 成功修复 {fpath} 的 union __packed 声明")
              except Exception as e:
                  print(f"处理 {fpath} 出错: {e}")

          # 6. 修复 selinux_state __rticdata 导致的 AArch64 ADRP 重定位截断溢出
          try:
              with open("include/linux/init.h", "r", encoding="utf-8", errors="ignore") as f:
                  ih = f.read()
              ih = ih.replace('#define __rticdata  __attribute__((section(".bss.rtic")))', '#define __rticdata')
              with open("include/linux/init.h", "w", encoding="utf-8") as f:
                  f.write(ih)

              with open("security/selinux/hooks.c", "r", encoding="utf-8", errors="ignore") as f:
                  sh = f.read()
              sh = sh.replace("struct selinux_state selinux_state __rticdata;", "struct selinux_state selinux_state;")
              with open("security/selinux/hooks.c", "w", encoding="utf-8") as f:
                  f.write(sh)

              with open("arch/arm64/kernel/vmlinux.lds.S", "r", encoding="utf-8", errors="ignore") as f:
                  vl = f.read()
              vl = vl.replace("RTIC_BSS", "/* RTIC_BSS */")
              with open("arch/arm64/kernel/vmlinux.lds.S", "w", encoding="utf-8") as f:
                  f.write(vl)
              print("✔ 成功修复 selinux_state RTIC 重定位截断溢出问题")
          except Exception as e:
              print(f"处理 RTIC 出错: {e}")
          PY

          # 清理旧有的残留链接或子模块目录
          rm -rf KernelSU KernelSU-Next drivers/kernelsu

          KSU_VER="${{ github.event.inputs.ksu_version || 'v0.9.5' }}"
          echo ">> 正在安装官方稳定版 KernelSU ($KSU_VER)..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_VER"

          DEFCONFIG="arch/arm64/configs/vendor/gauguin_user_defconfig"
          echo ">> 开启 KPROBES、OVERLAY_FS 及 KSU 配置支持..."
          scripts/config --file $DEFCONFIG -e KPROBES
          scripts/config --file $DEFCONFIG -e HAVE_KPROBES
          scripts/config --file $DEFCONFIG -e KPROBE_EVENTS
          scripts/config --file $DEFCONFIG -e OVERLAY_FS
          scripts/config --file $DEFCONFIG -e KSU

          # 确保如果源码中存在 MODULE_IMPORT_NS，则安全屏蔽
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/MODULE_IMPORT_NS/\/\/ MODULE_IMPORT_NS/g' {} + 2>/dev/null || true

      - name: 编译内核 Image
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          echo ">> 生成内核 .config..."
          make O=out CC=clang ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            OBJDUMP=llvm-objdump \
            vendor/gauguin_user_defconfig

          echo ">> 开始并行编译内核 Image..."
          make O=out CC=clang ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            OBJDUMP=llvm-objdump \
            KCFLAGS="-w" \
            -j$(nproc) Image 2>&1 | tee $GITHUB_WORKSPACE/build.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "==================== [编译失败分析] 捕获到的所有错误信息如下 ===================="
            grep -B 2 -A 5 -E "error:|fatal error:" $GITHUB_WORKSPACE/build.log || tail -n 120 $GITHUB_WORKSPACE/build.log
            echo "=================================================================================="
            exit 1
          fi

      - name: 提取产物并合成最终刷机镜像
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out_artifacts
          cp kernel/out/arch/arm64/boot/Image out_artifacts/Image
          echo ">> 内核 Image 提取成功: $(ls -lh out_artifacts/Image)"

          # 拉取 AnyKernel3 模版
          git clone --depth=1 https://github.com/Molyuu/AnyKernel3.git -b main AnyKernel3

          # 获取 Linux x86_64 架构原生的 magiskboot 二进制
          echo ">> 下载官方 x86_64 架构 magiskboot..."
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk -O magisk.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          # 解包原厂 pure_stock_boot.img 并合成 boot-kernelsu.img
          if [ -f "pure_stock_boot.img.gz" ]; then
            echo ">> 正在从原机纯净底包合成 boot-kernelsu.img..."
            gzip -dc pure_stock_boot.img.gz > pure_stock_boot.img

            mkdir boot_unpack && cd boot_unpack
            ../magiskboot unpack ../pure_stock_boot.img

            # 替换内核为刚刚编译出的 KernelSU 内核 (DTB 保留原机出厂 100% 完美匹配的 DTB)
            cp ../out_artifacts/Image kernel

            ../magiskboot repack ../pure_stock_boot.img ../out_artifacts/boot-kernelsu.img
            # 提取原厂完美 DTB
            if [ -f dtb ]; then
              cp dtb ../out_artifacts/dtb
              cp dtb ../AnyKernel3/dtb
            fi
            cd ..
            echo ">> boot-kernelsu.img 合成成功！"
          fi

          # 打包 AnyKernel3 卡刷包
          cp out_artifacts/Image AnyKernel3/Image
          cd AnyKernel3
          ZIP_NAME="AnyKernel3-Gauguin-KernelSU-$(date +'%Y%m%d%H%M').zip"
          zip -r9 ../out_artifacts/$ZIP_NAME * -x .git README.md
          echo ">> AnyKernel3 打包成功: $ZIP_NAME"

      - name: 上传编译产物 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gauguin-KernelSU-Output
          path: |
            out_artifacts/*
